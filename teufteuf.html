<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Teuf-Teuf</title>
<style>
  :root {
    --sea: #3fa7d6;
    --sea-dark: #2a86b3;
    --ink: #17324d;
    --sun: #ffd166;
    --red: #e63946;
    --green: #2a9d8f;
    --card: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #eaf6fb;
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 16px 24px;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  header {
    width: 100%; max-width: 480px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  h1 { font-size: 30px; margin: 0; letter-spacing: 0.5px; }
  button {
    font: inherit; border: 0; border-radius: 999px; cursor: pointer;
    padding: 12px 20px; font-size: 18px; font-weight: 700;
  }
  #connect { background: var(--green); color: #fff; box-shadow: 0 4px 0 #1d7065; }
  #connect:active { transform: translateY(2px); box-shadow: 0 2px 0 #1d7065; }
  #connect.on { background: #cfe9e5; color: #1d7065; box-shadow: none; }
  #status { min-height: 22px; margin: 6px 0 10px; font-size: 15px; opacity: 0.75; text-align: center; }

  .sea {
    width: 100%; max-width: 480px; aspect-ratio: 1 / 1; max-height: 34vh;
    border-radius: 28px; overflow: hidden; background: var(--sea);
    box-shadow: inset 0 0 0 6px var(--sea-dark);
  }
  .sea { display: flex; align-items: center; justify-content: center; }
  .sea:has(.boat-pic) { aspect-ratio: 4 / 3; max-height: 36vh; }
  .boat-pic { width: 100%; height: 100%; object-fit: cover; object-position: center 60%; display: block; }

  .wheel-wrap { width: 100%; max-width: min(300px, 36vh); margin-top: 14px; touch-action: none; }
  #wheel { width: 100%; display: block; touch-action: none; cursor: grab; }

  .row {
    width: 100%; max-width: 480px; margin-top: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  #straight { background: var(--sun); color: var(--ink); box-shadow: 0 4px 0 #d9a93c; }
  #straight:active { transform: translateY(2px); box-shadow: 0 2px 0 #d9a93c; }
  label { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  label input { width: 22px; height: 22px; accent-color: var(--green); }
  #sleep { margin-top: 18px; background: transparent; color: var(--ink); opacity: 0.55; font-size: 15px; padding: 8px 14px; }

  .right { display: flex; align-items: center; gap: 10px; }
  #bat { display: none; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
  #bat.show { display: flex; }
  .bat-body {
    position: relative; width: 30px; height: 15px; border: 2px solid var(--ink); border-radius: 4px; padding: 1px;
  }
  .bat-body::after {
    content: ""; position: absolute; right: -5px; top: 3px; width: 3px; height: 5px;
    background: var(--ink); border-radius: 0 2px 2px 0;
  }
  #batFill { height: 100%; border-radius: 2px; background: var(--green); width: 0; transition: width .4s; }
  #bat.low #batFill { background: var(--red); }
  #bat.low { color: var(--red); }

  #setCenter { margin-top: 14px; background: var(--sun); color: var(--ink); box-shadow: 0 4px 0 #d9a93c; font-size: 16px; padding: 10px 18px; }
  #setCenter:active { transform: translateY(2px); box-shadow: 0 2px 0 #d9a93c; }
</style>
</head>
<body>

<header>
  <h1>Teuf-Teuf</h1>
  <div class="right">
    <div id="bat" title="Batterie du bateau">
      <div class="bat-body"><div id="batFill"></div></div>
      <span id="batText"></span>
    </div>
    <button id="connect">Connecter</button>
  </div>
</header>
<div id="status">Appuie sur Connecter, puis choisis TEUF TEUF BLEU</div>

<div class="sea" id="sea">
  <img class="boat-pic" src="image.png" alt="Bateau de course">
</div>

<div class="wheel-wrap">
  <svg id="wheel" viewBox="0 0 200 200" aria-label="Volant">
    <g id="wheelG" style="transform-origin: 100px 100px">
      <g stroke="#8d5524" stroke-width="10" stroke-linecap="round">
        <line x1="100" y1="100" x2="100" y2="14"/>
        <line x1="100" y1="100" x2="100" y2="186"/>
        <line x1="100" y1="100" x2="14" y2="100"/>
        <line x1="100" y1="100" x2="186" y2="100"/>
        <line x1="100" y1="100" x2="39" y2="39"/>
        <line x1="100" y1="100" x2="161" y2="39"/>
        <line x1="100" y1="100" x2="39" y2="161"/>
        <line x1="100" y1="100" x2="161" y2="161"/>
      </g>
      <circle cx="100" cy="100" r="72" fill="none" stroke="#c68642" stroke-width="18"/>
      <circle cx="100" cy="100" r="72" fill="none" stroke="#8d5524" stroke-width="2"/>
      <circle cx="100" cy="100" r="22" fill="#c68642" stroke="#8d5524" stroke-width="4"/>
      <circle cx="100" cy="100" r="8" fill="var(--sun)"/>
      <!-- top marker so kids see which way it's turned -->
      <circle cx="100" cy="20" r="10" fill="var(--red)" stroke="#fff" stroke-width="3"/>
    </g>
  </svg>
</div>

<div class="row">
  <button id="straight">Tout droit</button>
  <label><input type="checkbox" id="autocenter" checked> Retour au centre</label>
</div>

<button id="setCenter">Réglage centre</button>

<button id="sleep">STOP</button>

<script>
// ---------- Settings ----------
const CENTER    = 90;   // servo angle when going straight
const RANGE     = 60;   // max degrees left/right from CENTER
const REVERSE   = true;  // true if the boat turns the wrong way
const WHEEL_MAX = 135;  // how far the wheel turns each way (degrees)
// ------------------------------

const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

const $ = id => document.getElementById(id);
const statusEl = $('status'), connectBtn = $('connect');

let device = null, rx = null;
let wheel = 0;            // current wheel angle, -WHEEL_MAX..WHEEL_MAX
let lastSent = null, pending = null, busy = false;
const queue = [];         // commands that must all be sent, in order (trim, sleep…)
let rxBuffer = '';

function setStatus(t) { statusEl.textContent = t; }

// ---------- Bluetooth ----------
async function connect() {
  if (!navigator.bluetooth) {
    setStatus('Ouvre cette page dans l’app Bluefy pour utiliser le Bluetooth');
    return;
  }
  try {
    if (!device) {
      device = await navigator.bluetooth.requestDevice({ filters: [{ services: [NUS] }] });
      device.addEventListener('gattserverdisconnected', onDisconnect);
    }
    setStatus('Connexion…');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    rx = await svc.getCharacteristic(RX);
    try {
      const tx = await svc.getCharacteristic(TX);
      tx.addEventListener('characteristicvaluechanged', onNotify);
      await tx.startNotifications();
    } catch (e) { /* steering still works without replies */ }
    command('?');   // ask for the battery level
    connectBtn.textContent = 'Connecté';
    connectBtn.classList.add('on');
    setStatus('Prêt ! Tourne le volant');
    lastSent = null;
    update();
  } catch (e) {
    setStatus('Connexion impossible : ' + (e.message || e));
  }
}

function onDisconnect() {
  rx = null;
  queue.length = 0;
  connectBtn.textContent = 'Connecter';
  connectBtn.classList.remove('on');
  $('bat').classList.remove('show');
  setStatus('Bateau déconnecté. Appuie sur Connecter');
}

// ---------- Messages from the boat ----------
function onNotify(e) {
  rxBuffer += new TextDecoder().decode(e.target.value);
  let i;
  while ((i = rxBuffer.indexOf('\n')) >= 0) {
    handleLine(rxBuffer.slice(0, i).trim());
    rxBuffer = rxBuffer.slice(i + 1);
  }
}

function handleLine(line) {
  let m;
  if ((m = line.match(/^Bat (-?\d+),(\d+)/))) showBattery(+m[1], +m[2]);
}

function showBattery(pct, mv) {
  const el = $('bat');
  if (pct < 0) { el.classList.remove('show'); return; }   // no divider wired
  el.classList.add('show');
  el.classList.toggle('low', pct <= 20);
  $('batFill').style.width = Math.max(4, pct) + '%';
  $('batText').textContent = pct + '%';
  el.title = `Batterie : ${pct}% (${(mv / 1000).toFixed(2)} V)`;
}


async function write(text) {
  const data = new TextEncoder().encode(text);
  if (rx.writeValueWithoutResponse) await rx.writeValueWithoutResponse(data);
  else await rx.writeValue(data);
}

// One write at a time: queued commands first (all of them, in order),
// then only the latest steering angle
async function pump() {
  if (busy) return;
  busy = true;
  while ((queue.length || pending !== null) && rx) {
    let v;
    if (queue.length) v = queue.shift();
    else { v = pending; pending = null; }
    try { await write(v); } catch (e) { /* drop and keep going */ }
    await new Promise(r => setTimeout(r, 40));
  }
  busy = false;
}

function send(text) {
  if (!rx) return;
  pending = text;
  pump();
}

function command(text) {
  if (!rx) return;
  queue.push(text);
  pump();
}

// ---------- Steering ----------
function update() {
  const steer = wheel / WHEEL_MAX;                 // -1 (left) .. 1 (right)
  $('wheelG').style.transform = `rotate(${wheel}deg)`;

  const angle = Math.round(CENTER + (REVERSE ? -1 : 1) * steer * RANGE);
  if (angle !== lastSent) { lastSent = angle; send(String(angle)); }
}

function setWheel(v) {
  wheel = Math.max(-WHEEL_MAX, Math.min(WHEEL_MAX, v));
  update();
}

let springAnim = null;
function springBack() {
  cancelAnimationFrame(springAnim);
  const step = () => {
    if (Math.abs(wheel) < 1) { setWheel(0); return; }
    setWheel(wheel * 0.8);
    springAnim = requestAnimationFrame(step);
  };
  step();
}

const wheelEl = $('wheel');
let dragging = false, lastPointerAngle = 0;

function pointerAngle(e) {
  const r = wheelEl.getBoundingClientRect();
  return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
}

wheelEl.addEventListener('pointerdown', e => {
  cancelAnimationFrame(springAnim);
  dragging = true;
  lastPointerAngle = pointerAngle(e);
  wheelEl.setPointerCapture(e.pointerId);
  e.preventDefault();
});

wheelEl.addEventListener('pointermove', e => {
  if (!dragging) return;
  const a = pointerAngle(e);
  let d = a - lastPointerAngle;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  lastPointerAngle = a;
  setWheel(wheel + d);
});

function endDrag() {
  if (!dragging) return;
  dragging = false;
  if ($('autocenter').checked) springBack();
}
wheelEl.addEventListener('pointerup', endDrag);
wheelEl.addEventListener('pointercancel', endDrag);

// ---------- Buttons ----------
connectBtn.addEventListener('click', () => { if (!rx) connect(); });
$('straight').addEventListener('click', springBack);
$('sleep').addEventListener('click', () => {
  if (!rx) { setStatus('Pas connecté'); return; }
  if (confirm('Es-tu sûr ?')) command('Z');
});

// ---------- Center trim ----------
function needConnection() {
  if (rx) return false;
  setStatus('Pas connecté');
  return true;
}
$('setCenter').addEventListener('click', () => {
  if (needConnection()) return;
  const angle = Math.round(CENTER + (REVERSE ? -1 : 1) * (wheel / WHEEL_MAX) * RANGE);
  command('S' + angle);          // "this angle is straight"
  pending = null;                // drop any older angle still waiting
  cancelAnimationFrame(springAnim);
  wheel = 0;
  lastSent = CENTER;             // the boat is already at the new center
  $('wheelG').style.transform = 'rotate(0deg)';
  setStatus('Nouveau centre enregistré');
});

update();
</script>
</body>
</html>
